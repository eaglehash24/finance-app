<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои финансы</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Финансы">

<!-- Open Graph -->
<meta property="og:title" content="💰 Мои финансы">
<meta property="og:description" content="Умный учёт доходов и расходов">
<meta property="og:image" content="https://eaglehash24.github.io/finance-app/og-image.png?v=3">
<meta property="og:url" content="https://eaglehash24.github.io/finance-app/">
<meta property="og:type" content="website">

<link rel="icon" type="image/png" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #0F0F14; color: #fff; max-width: 600px; margin: 0 auto; padding: 20px; min-height: 100vh; }

/* Шапка */
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.month-display { font-size: 20px; font-weight: 700; }
.month-select { padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; display: none; }
.menu-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; color: white; cursor: pointer; }

/* Неоновый Баланс */
.balance-card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 30px;
  margin-bottom: 20px;
  text-align: center;
  box-shadow: 0 0 20px rgba(0, 255, 136, 0.1);
}
.balance-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.balance-value {
  font-size: 48px;
  font-weight: 800;
  background: linear-gradient(90deg, #00FF88, #00D4FF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 15px;
  text-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
}
.balance-placeholder { color: #666; font-style: italic; font-size: 14px; padding: 10px 0; }
.balance-details { display: flex; justify-content: center; gap: 20px; font-size: 13px; color: #aaa; }

/* Фильтры и Списки */
.period-filter { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; }
.filter-btn { padding: 6px 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; color: #ccc; font-size: 12px; cursor: pointer; white-space: nowrap; }
.filter-btn.active { background: #667eea; color: white; border-color: #667eea; }
.lists-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
.list-block h3 { font-size: 12px; text-transform: uppercase; color: #888; margin-bottom: 10px; }
.tx-mini { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px; margin-bottom: 8px; font-size: 13px; position: relative; }
.tx-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.tx-desc { font-weight: 600; }
.tx-amount { font-weight: 700; }
.tx-meta { font-size: 11px; color: #666; }
.tx-actions { display: flex; justify-content: space-between; margin-top: 8px; }
.action-icon { width: 16px; height: 16px; cursor: pointer; }
.edit-icon { color: #667eea; }
.del-icon { color: #FF6B6B; }

/* Ввод */
.input-section { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
.currency-switch { display: flex; gap: 10px; margin-bottom: 15px; }
.curr-btn { flex: 1; padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #888; font-size: 12px; cursor: pointer; text-align: center; }
.curr-btn.active { background: rgba(255,255,255,0.15); color: white; border-color: rgba(255,255,255,0.3); }
.input-group { margin-bottom: 12px; }
.input-group label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
.input-group input, .input-group select { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; font-size: 14px; font-family: 'Inter', sans-serif; }
.add-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; color: white; font-size: 14px; font-weight: 600; cursor: pointer; }
.add-btn.expense { background: linear-gradient(135deg, #FF6B6B 0%, #E05555 100%); }
.add-btn.income { background: linear-gradient(135deg, #00FF88 0%, #00D4FF 100%); color: #0F0F14; }

/* Графики */
.chart-section { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
.chart-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
.chart-tab { flex: 1; padding: 10px; background: rgba(255,255,255,0.05); border: none; border-radius: 10px; color: #888; cursor: pointer; font-weight: 600; }
.chart-tab.active { background: rgba(102, 126, 234, 0.2); color: #667eea; border: 1px solid rgba(102, 126, 234, 0.4); }
.chart-container { height: 200px; position: relative; }

/* Меню и Модалки */
.dropdown-menu { display: none; position: absolute; top: 60px; right: 20px; background: rgba(26, 26, 36, 0.98); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; min-width: 200px; z-index: 1000; }
.dropdown-menu.active { display: block; }
.dropdown-item { padding: 12px 16px; display: flex; align-items: center; gap: 10px; color: #ccc; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
.modal.active { display: flex; }
.modal-content { background: #1A1A24; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 25px; width: 100%; max-width: 400px; }
.close-modal { float: right; cursor: pointer; color: #888; }
@media (max-width: 480px) { .lists-container { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="header">
  <div id="month-text" class="month-display">Октябрь 2026</div>
  <select id="month-select" class="month-select" onchange="changeMonth()"></select>
  <button class="menu-btn" onclick="toggleMenu()"><i data-lucide="menu"></i></button>
</div>

<div class="dropdown-menu" id="main-menu">
  <div class="dropdown-item" onclick="openBalanceModal()">💵 Начальный баланс</div>
  <div class="dropdown-item" onclick="exportToPDF()">📄 Экспорт в PDF</div>
  <div class="dropdown-item" onclick="resetMonth()">🗑️ Обнулить месяц</div>
</div>

<!-- Неоновый Баланс -->
<div class="balance-card">
  <div class="balance-label">Общий баланс</div>
  <div id="balance-main"></div>
</div>

<div class="period-filter">
  <button class="filter-btn active" onclick="setFilter('today')">Сегодня</button>
  <button class="filter-btn" onclick="setFilter('yesterday')">Вчера</button>
  <button class="filter-btn" onclick="setFilter('week')">Неделя</button>
  <button class="filter-btn" onclick="setFilter('month')">Месяц</button>
</div>

<div class="lists-container">
  <div class="list-block"><h3 style="color:#FF6B6B">Расходы</h3><div id="expense-list"></div></div>
  <div class="list-block"><h3 style="color:#00FF88">Доходы</h3><div id="income-list"></div></div>
</div>

<!-- Ввод Расхода -->
<div class="input-section">
  <div class="currency-switch" id="exp-curr">
    <div class="curr-btn" onclick="setCurr('expense','USD')">$ USD</div>
    <div class="curr-btn active" onclick="setCurr('expense','UAH')">₴ UAH</div>
    <div class="curr-btn" onclick="setCurr('expense','EUR')">€ EUR</div>
  </div>
  <div class="input-group">
    <label>Категория</label>
    <select id="exp-cat" onchange="checkNewCat('exp')"></select>
    <input type="text" id="exp-new-cat" placeholder="Новая категория..." style="display:none; margin-top:5px;">
  </div>
  <div class="input-group">
    <label>Описание / Сумма</label>
    <input type="text" id="exp-desc" placeholder="Например: 500 бургер" onkeypress="handleEnter(event, 'expense')">
  </div>
  <button class="add-btn expense" onclick="addTransaction('expense')">Добавить расход</button>
</div>

<!-- Ввод Дохода -->
<div class="input-section">
  <div class="currency-switch" id="inc-curr">
    <div class="curr-btn" onclick="setCurr('income','USD')">$ USD</div>
    <div class="curr-btn active" onclick="setCurr('income','UAH')">₴ UAH</div>
    <div class="curr-btn" onclick="setCurr('income','EUR')">€ EUR</div>
  </div>
  <div class="input-group">
    <label>Категория</label>
    <select id="inc-cat" onchange="checkNewCat('inc')"></select>
    <input type="text" id="inc-new-cat" placeholder="Новая категория..." style="display:none; margin-top:5px;">
  </div>
  <div class="input-group">
    <label>Описание / Сумма</label>
    <input type="text" id="inc-desc" placeholder="Например: 1000 зарплата" onkeypress="handleEnter(event, 'income')">
  </div>
  <button class="add-btn income" onclick="addTransaction('income')">Добавить доход</button>
</div>

<div class="chart-section">
  <div class="chart-tabs">
    <button class="chart-tab active" onclick="switchChart('expense')">Расходы</button>
    <button class="chart-tab" onclick="switchChart('income')">Доходы</button>
  </div>
  <div class="chart-container"><canvas id="mainChart"></canvas></div>
</div>

<!-- Модалка баланса -->
<div class="modal" id="bal-modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal('bal-modal')"><i data-lucide="x"></i></span>
    <h2>Начальный баланс</h2>
    <div class="input-group"><label>USD</label><input type="number" id="bal-usd"></div>
    <div class="input-group"><label>UAH</label><input type="number" id="bal-uah"></div>
    <div class="input-group"><label>EUR</label><input type="number" id="bal-eur"></div>
    <button class="add-btn" style="background:#667eea; margin-top:15px;" onclick="saveBalances()">Сохранить</button>
  </div>
</div>

<!-- Модалка редактирования -->
<div class="modal" id="edit-modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal('edit-modal')"><i data-lucide="x"></i></span>
    <h2>Редактировать запись</h2>
    <div class="input-group"><label>Сумма</label><input type="number" id="edit-amount"></div>
    <div class="input-group"><label>Категория</label><select id="edit-cat"></select></div>
    <div class="input-group"><label>Описание</label><input type="text" id="edit-desc"></div>
    <button class="add-btn" style="background:#667eea; margin-top:15px;" onclick="saveEdit()">Сохранить изменения</button>
  </div>
</div>

<script>
let allData = JSON.parse(localStorage.getItem('finData')) || {};
let balances = JSON.parse(localStorage.getItem('finBal')) || {USD:0, UAH:0, EUR:0};
let currentMonth = new Date().toISOString().slice(0, 7);
let currentFilter = 'today';
let chartType = 'expense';
let pieChart = null;
let expCurr = 'UAH', incCurr = 'UAH';
let editingId = null;

const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const expCats = ['Еда','Транспорт','Жильё','Здоровье','Развлечения','Одежда','Подарки','Прочее'];
const incCats = ['Зарплата','Пенсия','Подарки','Фриланс','Кэшбэк','Прочее'];

if(!allData[currentMonth]) allData[currentMonth] = [];
init();

function init() {
  updateMonthUI();
  updateBalanceUI();
  updateLists();
  updateChart();
  populateCategories();
  lucide.createIcons();
}

function updateBalanceUI() {
  const container = document.getElementById('balance-main');
  const txs = allData[currentMonth] || [];
  
  // Проверяем, есть ли вообще деньги или записи
  let hasActivity = false;
  ['USD','UAH','EUR'].forEach(c => {
    if(balances[c] !== 0) hasActivity = true;
    if(txs.some(t => t.currency === c)) hasActivity = true;
  });

  if (!hasActivity) {
    container.innerHTML = `<div class="balance-placeholder">Введите начальный баланс или создайте новый доход</div>`;
    return;
  }

  // Если активность есть, показываем неоновую цифру (суммируем для красоты или показываем основную)
  // Для простоты покажем сумму по основной валюте или просто список активных
  let html = '';
  let totalMain = 0; // Например, в гривнах
  
  ['USD','UAH','EUR'].forEach(c => {
    const income = txs.filter(t => t.type === 'income' && t.currency === c).reduce((s,t)=>s+t.amount,0);
    const expense = txs.filter(t => t.type === 'expense' && t.currency === c).reduce((s,t)=>s+t.amount,0);
    const total = balances[c] + income - expense;
    
    // Показываем только если не 0
    if(total !== 0 || balances[c] !== 0) {
        const sym = c === 'USD' ? '$' : c === 'UAH' ? '₴' : '€';
        // Делаем главную цифру самой большой
        if(c === 'UAH') {
             // Можно сделать акцент на гривне, но пока просто список
        }
        html += `<div style="margin-bottom:5px; font-size:18px;"><span style="color:#888">${sym} ${c}:</span> <span style="font-weight:700; color:#fff">${sym}${total.toFixed(2)}</span></div>`;
    }
  });
  
  // Если html пуст (все по нулям, но записи были), пишем 0
  if(!html) html = '<div style="font-size:18px; color:#fff">0.00</div>';
  
  container.innerHTML = html;
}

function updateMonthUI() {
  const months = Object.keys(allData).sort();
  const textEl = document.getElementById('month-text');
  const selectEl = document.getElementById('month-select');
  const [y, m] = currentMonth.split('-');
  textEl.textContent = `${monthNames[parseInt(m)-1]} ${y}`;
  if(months.length > 1) {
    textEl.style.display = 'none';
    selectEl.style.display = 'block';
    selectEl.innerHTML = '';
    months.forEach(mo => {
      const opt = document.createElement('option');
      opt.value = mo;
      const [yy, mm] = mo.split('-');
      opt.textContent = `${monthNames[parseInt(mm)-1]} ${yy}`;
      if(mo === currentMonth) opt.selected = true;
      selectEl.appendChild(opt);
    });
  } else {
    textEl.style.display = 'block';
    selectEl.style.display = 'none';
  }
}

function changeMonth() {
  currentMonth = document.getElementById('month-select').value;
  if(!allData[currentMonth]) allData[currentMonth] = [];
  init();
}

function setCurr(type, curr) {
  if(type === 'expense') expCurr = curr; else incCurr = curr;
  const container = document.getElementById(type === 'expense' ? 'exp-curr' : 'inc-curr');
  Array.from(container.children).forEach(btn => btn.classList.toggle('active', btn.textContent.includes(curr)));
}

function populateCategories() {
  const expSelect = document.getElementById('exp-cat');
  const incSelect = document.getElementById('inc-cat');
  
  const allExp = new Set([...expCats]);
  Object.values(allData).forEach(m => m.forEach(t => { if(t.type==='expense' && t.category) allExp.add(t.category); }));
  expSelect.innerHTML = Array.from(allExp).map(c => `<option value="${c}">${c}</option>`).join('') + '<option value="__NEW__">➕ Создать свою...</option>';

  const allInc = new Set([...incCats]);
  Object.values(allData).forEach(m => m.forEach(t => { if(t.type==='income' && t.category) allInc.add(t.category); }));
  incSelect.innerHTML = Array.from(allInc).map(c => `<option value="${c}">${c}</option>`).join('') + '<option value="__NEW__">➕ Создать свою...</option>';
}

function checkNewCat(prefix) {
  const select = document.getElementById(`${prefix}-cat`);
  const input = document.getElementById(`${prefix}-new-cat`);
  input.style.display = select.value === '__NEW__' ? 'block' : 'none';
}

function parseInput(text) {
  const match = text.match(/(\d+[\.,]?\d*)/);
  const amount = match ? parseFloat(match[1].replace(',','.')) : 0;
  const desc = text.replace(match ? match[0] : '', '').trim();
  return { amount, desc: desc || 'Без описания' };
}

function addTransaction(type) {
  const prefix = type === 'expense' ? 'exp' : 'inc';
  const descInput = document.getElementById(`${prefix}-desc`);
  const catSelect = document.getElementById(`${prefix}-cat`);
  const newCatInput = document.getElementById(`${prefix}-new-cat`);
  
  const { amount, desc } = parseInput(descInput.value);
  if(amount <= 0) return alert('Введите сумму!');
  
  let category = catSelect.value;
  if(category === '__NEW__') {
    category = newCatInput.value.trim();
    if(!category) return alert('Введите название категории!');
  }
  
  const curr = type === 'expense' ? expCurr : incCurr;
  const tx = { id: Date.now(), type, amount, currency: curr, category, description: desc, date: new Date().toISOString() };
  
  allData[currentMonth].push(tx);
  localStorage.setItem('finData', JSON.stringify(allData));
  
  descInput.value = '';
  newCatInput.value = '';
  newCatInput.style.display = 'none';
  catSelect.selectedIndex = 0;
  init();
}

function handleEnter(e, type) { if(e.key === 'Enter') addTransaction(type); }

function getFilteredTx() {
  const now = new Date();
  return (allData[currentMonth] || []).filter(t => {
    const d = new Date(t.date);
    if(currentFilter === 'today') return d.toDateString() === now.toDateString();
    if(currentFilter === 'yesterday') { const y = new Date(now); y.setDate(y.getDate()-1); return d.toDateString() === y.toDateString(); }
    if(currentFilter === 'week') { const w = new Date(now); w.setDate(w.getDate()-7); return d >= w; }
    return true;
  });
}

function updateLists() {
  const txs = getFilteredTx();
  const render = (type, elId) => {
    const list = txs.filter(t => t.type === type).slice(-5).reverse();
    const el = document.getElementById(elId);
    if(list.length === 0) { el.innerHTML = '<div style="color:#666;font-size:12px">Нет записей</div>'; return; }
    el.innerHTML = list.map(t => {
      const sym = t.currency === 'USD' ? '$' : t.currency === 'UAH' ? '₴' : '€';
      const color = type === 'expense' ? '#FF6B6B' : '#00FF88';
      return `
        <div class="tx-mini">
          <div class="tx-header">
            <span class="tx-desc">${t.description}</span>
            <span class="tx-amount" style="color:${color}">${sym}${t.amount}</span>
          </div>
          <div class="tx-meta">${t.category}</div>
          <div class="tx-actions">
            <i data-lucide="pencil" class="action-icon edit-icon" onclick="openEdit(${t.id})"></i>
            <i data-lucide="trash-2" class="action-icon del-icon" onclick="deleteTx(${t.id})"></i>
          </div>
        </div>`;
    }).join('');
    lucide.createIcons();
  };
  render('expense', 'expense-list');
  render('income', 'income-list');
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  updateLists();
}

function switchChart(type) {
  chartType = type;
  document.querySelectorAll('.chart-tab').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  updateChart();
}

function updateChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');
  const txs = (allData[currentMonth] || []).filter(t => t.type === chartType);
  const byCat = {};
  const total = txs.reduce((s,t) => s+t.amount, 0);
  txs.forEach(t => byCat[t.category] = (byCat[t.category] || 0) + t.amount);
  
  if(pieChart) pieChart.destroy();
  pieChart = new Chart(ctx, {
    type: 'doughnut',
    data: { 
      labels: Object.keys(byCat).map(k => `${k} (${((byCat[k]/total)*100).toFixed(0)}%)`), 
      datasets: [{ data: Object.values(byCat), backgroundColor: ['#667eea','#764ba2','#00FF88','#FF6B6B','#FFC107','#00BCD4'], borderWidth: 0 }] 
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position:'bottom', labels:{color:'#fff'} } } }
  });
}

function toggleMenu() { document.getElementById('main-menu').classList.toggle('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function openBalanceModal() {
  document.getElementById('bal-usd').value = balances.USD;
  document.getElementById('bal-uah').value = balances.UAH;
  document.getElementById('bal-eur').value = balances.EUR;
  document.getElementById('bal-modal').classList.add('active');
  toggleMenu();
}
function saveBalances() {
  balances.USD = parseFloat(document.getElementById('bal-usd').value) || 0;
  balances.UAH = parseFloat(document.getElementById('bal-uah').value) || 0;
  balances.EUR = parseFloat(document.getElementById('bal-eur').value) || 0;
  localStorage.setItem('finBal', JSON.stringify(balances));
  closeModal('bal-modal');
  init();
}

function openEdit(id) {
  const tx = (allData[currentMonth] || []).find(t => t.id === id);
  if(!tx) return;
  editingId = id;
  document.getElementById('edit-amount').value = tx.amount;
  document.getElementById('edit-desc').value = tx.description;
  
  const catSelect = document.getElementById('edit-cat');
  const cats = tx.type === 'expense' ? expCats : incCats;
  const allCats = new Set([...cats]);
  Object.values(allData).forEach(m => m.forEach(t => { if(t.type===tx.type && t.category) allCats.add(t.category); }));
  catSelect.innerHTML = Array.from(allCats).map(c => `<option value="${c}" ${c===tx.category?'selected':''}>${c}</option>`).join('');
  
  document.getElementById('edit-modal').classList.add('active');
}

function saveEdit() {
  const tx = (allData[currentMonth] || []).find(t => t.id === editingId);
  if(tx) {
    tx.amount = parseFloat(document.getElementById('edit-amount').value);
    tx.description = document.getElementById('edit-desc').value;
    tx.category = document.getElementById('edit-cat').value;
    localStorage.setItem('finData', JSON.stringify(allData));
    closeModal('edit-modal');
    init();
  }
}

function deleteTx(id) {
  if(!confirm('Удалить запись?')) return;
  allData[currentMonth] = allData[currentMonth].filter(t => t.id !== id);
  localStorage.setItem('finData', JSON.stringify(allData));
  init();
}

function resetMonth() {
  if(confirm('Обнулить все записи и баланс за этот месяц?')) {
    allData[currentMonth] = [];
    // Сбрасываем баланс только для текущего месяца? 
    // В текущей логике баланс глобальный. Если нужно сбросить глобально:
    balances = {USD:0, UAH:0, EUR:0};
    localStorage.setItem('finBal', JSON.stringify(balances));
    localStorage.setItem('finData', JSON.stringify(allData));
    init();
    toggleMenu();
  }
}

function exportToPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text("Отчет: Мои финансы", 14, 22);
  doc.autoTable({
    head: [['Дата', 'Тип', 'Категория', 'Описание', 'Сумма']],
    body: (allData[currentMonth]||[]).map(t => [new Date(t.date).toLocaleDateString(), t.type, t.category, t.description, `${t.currency} ${t.amount}`]),
    startY: 30
  });
  doc.save(`Otchet_${currentMonth}.pdf`);
  toggleMenu();
}

if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js'); }); }
</script>
</body>
</html>
