<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои финансы</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Финансы">

<!-- Open Graph -->
<meta property="og:title" content="💰 Мои финансы">
<meta property="og:description" content="Умный учёт доходов и расходов">
<meta property="og:image" content="https://eaglehash24.github.io/finance-app/og-image.png?v=3">
<meta property="og:url" content="https://eaglehash24.github.io/finance-app/">
<meta property="og:type" content="website">

<link rel="icon" type="image/png" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Inter', sans-serif; 
  background: #0F0F14; 
  color: #fff; 
  width: 100%;
  max-width: 1200px;
  margin: 0 auto; 
  padding: 20px; 
  min-height: 100vh; 
}

/* Шапка */
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.month-display { font-size: 20px; font-weight: 700; }
.month-select { 
  padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
  border-radius: 10px; color: white; display: none; appearance: none; -webkit-appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat; background-position: right 10px center; background-size: 16px; padding-right: 30px;
}
.menu-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; color: white; cursor: pointer; }

/* Баланс */
.balance-card {
  background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 25px; margin-bottom: 20px; text-align: center; width: 100%;
}
.balance-header { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px; }
.balance-label { font-size: 12px; color: #fff; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
.curr-selector { 
  background: transparent; border: 1px solid #667eea; color: #667eea; padding: 2px 8px; border-radius: 5px; 
  font-size: 12px; cursor: pointer; appearance: none; -webkit-appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat; background-position: right 5px center; background-size: 12px; padding-right: 20px;
}
.balance-value { font-size: 32px; font-weight: 700; color: #00FF88; margin-bottom: 15px; text-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }
.balance-details { display: flex; justify-content: center; gap: 20px; font-size: 14px; color: #aaa; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }

/* Кнопки добавления */
.quick-add-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; width: 100%; }
.add-btn-main {
  width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px;
}
.add-btn-main.exp { background: rgba(255, 107, 107, 0.1); color: #FF6B6B; border: 1px solid #FF6B6B; }
.add-btn-main.inc { background: rgba(0, 255, 136, 0.1); color: #00FF88; border: 1px solid #00FF88; }

/* Графики и Списки */
.charts-wrapper { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 15px; width: 100%; }
.chart-section { 
  background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); 
  border-radius: 16px; padding: 20px; width: 100%;
}
.chart-header { 
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; cursor: pointer; 
  user-select: none;
}
.chart-header h3 { display: flex; align-items: center; gap: 8px; }
.chart-currency-filter { display: flex; gap: 5px; }
.curr-filter-btn { padding: 5px 10px; background: rgba(255,255,255,0.05); border-radius: 5px; cursor: pointer; font-size: 12px; color: #888; }
.curr-filter-btn.active { background: #667eea; color: white; }

/* Выпадающее меню категорий */
.category-dropdown {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  background: #1A1A24;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  z-index: 100;
  width: 200px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.category-dropdown.active { display: block; }
.cat-option { padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; font-size: 14px; }
.cat-option:hover { background: rgba(255,255,255,0.05); }
.cat-option:last-child { border-bottom: none; }

/* Список транзакций с группировкой */
.tx-list-container {
  margin-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.1);
  padding-top: 15px;
}
.date-group-title {
  font-size: 12px;
  color: #667eea;
  font-weight: 700;
  margin: 15px 0 8px 0;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.tx-item { 
  background: rgba(255,255,255,0.03); padding: 10px; margin-bottom: 8px; border-radius: 8px; 
  display: flex; justify-content: space-between; align-items: center;
}
.tx-info b { display: block; margin-bottom: 2px; }
.tx-info span { font-size: 11px; color: #888; }
.tx-actions { display: flex; gap: 10px; }
.action-icon { width: 16px; height: 16px; cursor: pointer; }

/* Фильтры периода */
.period-filters { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
.period-btn {
  padding: 6px 12px; background: rgba(255,255,255,0.05); border-radius: 20px; border: none;
  color: #888; font-size: 12px; cursor: pointer; white-space: nowrap;
}
.period-btn.active { background: #667eea; color: white; }

.chart-container { height: 200px; position: relative; margin-bottom: 20px; }

/* Модалки */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
.modal.active { display: flex; }
.modal-content { background: #1A1A24; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 25px; width: 100%; max-width: 400px; }
.close-modal { float: right; cursor: pointer; color: #888; }
.input-group { margin-bottom: 12px; }
.input-group label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
.input-group input, .input-group select { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; font-size: 14px; font-family: 'Inter', sans-serif; }
.save-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; color: white; font-size: 14px; font-weight: 600; cursor: pointer; background: #667eea; margin-top: 10px; }

/* Меню */
.dropdown-menu { display: none; position: absolute; top: 60px; right: 20px; background: rgba(26, 26, 36, 0.98); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; min-width: 200px; z-index: 1000; }
.dropdown-menu.active { display: block; }
.dropdown-item { padding: 12px 16px; display: flex; align-items: center; gap: 10px; color: #ccc; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }

@media (min-width: 769px) { .charts-wrapper { grid-template-columns: 1fr 1fr; } }
@media (max-width: 768px) { body { max-width: 100%; } }
</style>
</head>
<body>

<div class="header">
  <div id="month-text" class="month-display">Октябрь 2026</div>
  <select id="month-select" class="month-select" onchange="changeMonth()"></select>
  <button class="menu-btn" onclick="toggleMenu()"><i data-lucide="menu"></i></button>
</div>

<div class="dropdown-menu" id="main-menu">
  <div class="dropdown-item" onclick="openBalanceModal()">💵 Баланс и Курсы</div>
  <div class="dropdown-item" onclick="exportToCSV()">📊 Экспорт в Excel</div>
  <div class="dropdown-item" onclick="resetMonth()">🗑️ Обнулить месяц</div>
</div>

<!-- Баланс -->
<div class="balance-card">
  <div class="balance-header">
    <div class="balance-label">Общий баланс</div>
    <select id="balance-curr-select" class="curr-selector" onchange="updateBalanceUI()">
      <option value="UAH">UAH</option>
      <option value="USD">USD</option>
      <option value="EUR">EUR</option>
    </select>
  </div>
  <div id="balance-main" class="balance-value">0,00 ₴</div>
  <div id="balance-details" class="balance-details"></div>
</div>

<!-- Кнопки быстрого доступа -->
<div class="quick-add-container">
  <button class="add-btn-main exp" onclick="openTxModal('expense')"><i data-lucide="minus-circle"></i> Добавить расход</button>
  <button class="add-btn-main inc" onclick="openTxModal('income')"><i data-lucide="plus-circle"></i> Добавить доход</button>
</div>

<!-- Графики и Списки -->
<div class="charts-wrapper">
  <!-- РАСХОДЫ -->
  <div class="chart-section" style="position:relative;">
    <div class="chart-header" onclick="toggleCategoryDropdown('expense')">
      <h3>Расходы <i data-lucide="chevron-down" style="width:16px;"></i></h3>
      <div class="chart-currency-filter">
        <div class="curr-filter-btn active" onclick="setChartCurr('expense','UAH'); event.stopPropagation();">UAH</div>
        <div class="curr-filter-btn" onclick="setChartCurr('expense','USD'); event.stopPropagation();">USD</div>
        <div class="curr-filter-btn" onclick="setChartCurr('expense','EUR'); event.stopPropagation();">EUR</div>
      </div>
    </div>
    
    <div id="exp-cat-dropdown" class="category-dropdown"></div>

    <div class="chart-container"><canvas id="expChart"></canvas></div>
    
    <div id="exp-list-view" style="display:none;">
      <div class="period-filters">
        <button class="period-btn active" onclick="setPeriodFilter('expense','all')">Все</button>
        <button class="period-btn" onclick="setPeriodFilter('expense','today')">Сегодня</button>
        <button class="period-btn" onclick="setPeriodFilter('expense','week')">Неделя</button>
        <button class="period-btn" onclick="setPeriodFilter('expense','month')">Месяц</button>
      </div>
      <div id="exp-list" class="tx-list-container"></div>
    </div>
  </div>

  <!-- ДОХОДЫ -->
  <div class="chart-section" style="position:relative;">
    <div class="chart-header" onclick="toggleCategoryDropdown('income')">
      <h3>Доходы <i data-lucide="chevron-down" style="width:16px;"></i></h3>
      <div class="chart-currency-filter">
        <div class="curr-filter-btn active" onclick="setChartCurr('income','UAH'); event.stopPropagation();">UAH</div>
        <div class="curr-filter-btn" onclick="setChartCurr('income','USD'); event.stopPropagation();">USD</div>
        <div class="curr-filter-btn" onclick="setChartCurr('income','EUR'); event.stopPropagation();">EUR</div>
      </div>
    </div>

    <div id="inc-cat-dropdown" class="category-dropdown"></div>

    <div class="chart-container"><canvas id="incChart"></canvas></div>

    <div id="inc-list-view" style="display:none;">
      <div class="period-filters">
        <button class="period-btn active" onclick="setPeriodFilter('income','all')">Все</button>
        <button class="period-btn" onclick="setPeriodFilter('income','today')">Сегодня</button>
        <button class="period-btn" onclick="setPeriodFilter('income','week')">Неделя</button>
        <button class="period-btn" onclick="setPeriodFilter('income','month')">Месяц</button>
      </div>
      <div id="inc-list" class="tx-list-container"></div>
    </div>
  </div>
</div>

<!-- Модалка Баланса и Курсов -->
<div class="modal" id="bal-modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal('bal-modal')"><i data-lucide="x"></i></span>
    <h2>Баланс и Курсы</h2>
    <div class="input-group"><label>Начальный USD</label><input type="number" id="bal-usd"></div>
    <div class="input-group"><label>Начальный UAH</label><input type="number" id="bal-uah"></div>
    <div class="input-group"><label>Начальный EUR</label><input type="number" id="bal-eur"></div>
    <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
    <div class="input-group"><label>Курс USD к UAH</label><input type="number" id="rate-usd" step="0.01"></div>
    <div class="input-group"><label>Курс EUR к UAH</label><input type="number" id="rate-eur" step="0.01"></div>
    <div class="input-group"><label>Курс EUR к USD</label><input type="number" id="rate-eur-usd" step="0.01"></div>
    <button class="save-btn" onclick="saveBalances()">Сохранить</button>
  </div>
</div>

<!-- Модалка Ввода Транзакции -->
<div class="modal" id="tx-modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal('tx-modal')"><i data-lucide="x"></i></span>
    <h2 id="tx-modal-title">Добавить запись</h2>
    <input type="hidden" id="tx-type">
    <input type="hidden" id="tx-edit-id">
    
    <div class="input-group">
      <label>Валюта</label>
      <select id="tx-curr">
        <option value="UAH">₴ UAH</option>
        <option value="USD">$ USD</option>
        <option value="EUR">€ EUR</option>
      </select>
    </div>
    
    <div class="input-group">
      <label>Категория</label>
      <select id="tx-cat" onchange="checkNewCatModal()"></select>
      <input type="text" id="tx-new-cat" placeholder="Новая категория..." style="display:none; margin-top:5px;">
    </div>

    <div class="input-group">
      <label>Сумма / Описание</label>
      <input type="text" id="tx-input" placeholder="Например: 500 бургер" onkeypress="handleModalEnter(event)">
    </div>

    <div class="input-group">
      <label>Дата</label>
      <input type="date" id="tx-date">
    </div>

    <button class="save-btn" onclick="saveTransaction()">Сохранить</button>
  </div>
</div>

<script>
let allData = JSON.parse(localStorage.getItem('finData')) || {};
let balances = JSON.parse(localStorage.getItem('finBal')) || {USD:0, UAH:0, EUR:0};
let rates = JSON.parse(localStorage.getItem('finRates')) || {USD:41.5, EUR:45.0, EUR_USD:1.08};
let currentMonth = new Date().toISOString().slice(0, 7);
let chartCurr = {expense: 'UAH', income: 'UAH'};
let expChart = null, incChart = null;
let selectedCat = {expense: '', income: ''};
let periodFilter = {expense: 'all', income: 'all'};

const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const expCats = ['Еда','Транспорт','Жильё','Здоровье','Развлечения','Одежда','Подарки','Прочее'];
const incCats = ['Зарплата','Пенсия','Подарки','Фриланс','Кэшбэк','Прочее'];

if(!allData[currentMonth]) allData[currentMonth] = [];
init();

function init() {
  updateMonthUI();
  updateBalanceUI();
  updateCharts();
  lucide.createIcons();
}

// --- БАЛАНС ---
function formatMoney(amount, curr) {
  const sym = curr === 'USD' ? '$' : curr === 'UAH' ? '₴' : '€';
  const formatted = amount.toFixed(2).replace(/\d(?=(\d{3})+(?!\d))/g, "$& ").replace('.', ',');
  return `${sym} ${formatted}`;
}

function updateBalanceUI() {
  const txs = allData[currentMonth] || [];
  const targetCurr = document.getElementById('balance-curr-select').value;
  let totalInTarget = 0;
  
  ['USD','UAH','EUR'].forEach(c => {
    const income = txs.filter(t => t.type === 'income' && t.currency === c).reduce((s,t)=>s+t.amount,0);
    const expense = txs.filter(t => t.type === 'expense' && t.currency === c).reduce((s,t)=>s+t.amount,0);
    const net = balances[c] + income - expense;
    let val = net;
    if(targetCurr === 'UAH') {
      if(c === 'USD') val = net * rates.USD;
      if(c === 'EUR') val = net * rates.EUR;
    } else if (targetCurr === 'USD') {
      if(c === 'UAH') val = net / rates.USD;
      if(c === 'EUR') val = net * rates.EUR_USD;
    } else if (targetCurr === 'EUR') {
      if(c === 'UAH') val = net / rates.EUR;
      if(c === 'USD') val = net / rates.EUR_USD;
    }
    totalInTarget += val;
  });

  document.getElementById('balance-main').textContent = formatMoney(totalInTarget, targetCurr);
  const detailsDiv = document.getElementById('balance-details');
  let html = '';
  ['USD','UAH','EUR'].forEach(c => {
    const income = txs.filter(t => t.type === 'income' && t.currency === c).reduce((s,t)=>s+t.amount,0);
    const expense = txs.filter(t => t.type === 'expense' && t.currency === c).reduce((s,t)=>s+t.amount,0);
    const total = balances[c] + income - expense;
    html += `<div>${formatMoney(total, c)}</div>`;
  });
  detailsDiv.innerHTML = html;
}

// --- МЕСЯЦЫ ---
function updateMonthUI() {
  const months = Object.keys(allData).sort();
  const textEl = document.getElementById('month-text');
  const selectEl = document.getElementById('month-select');
  const [y, m] = currentMonth.split('-');
  textEl.textContent = `${monthNames[parseInt(m)-1]} ${y}`;
  if(months.length > 1) {
    textEl.style.display = 'none';
    selectEl.style.display = 'block';
    selectEl.innerHTML = '';
    months.forEach(mo => {
      const opt = document.createElement('option');
      opt.value = mo;
      const [yy, mm] = mo.split('-');
      opt.textContent = `${monthNames[parseInt(mm)-1]} ${yy}`;
      if(mo === currentMonth) opt.selected = true;
      selectEl.appendChild(opt);
    });
  } else {
    textEl.style.display = 'block';
    selectEl.style.display = 'none';
  }
}

function changeMonth() {
  currentMonth = document.getElementById('month-select').value;
  if(!allData[currentMonth]) allData[currentMonth] = [];
  init();
}

// --- МОДАЛКИ И ВВОД ---
function openTxModal(type, editId = null) {
  document.getElementById('tx-type').value = type;
  document.getElementById('tx-edit-id').value = editId || '';
  document.getElementById('tx-modal-title').textContent = editId ? 'Редактировать запись' : (type === 'expense' ? 'Добавить расход' : 'Добавить доход');
  
  const catSelect = document.getElementById('tx-cat');
  const cats = type === 'expense' ? expCats : incCats;
  catSelect.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('') + '<option value="__NEW__">➕ Создать свою...</option>';
  
  if(editId) {
    let foundTx = null;
    Object.values(allData).forEach(monthTxs => {
      const tx = monthTxs.find(t => t.id == editId);
      if(tx) foundTx = tx;
    });
    if(foundTx) {
      document.getElementById('tx-curr').value = foundTx.currency;
      document.getElementById('tx-cat').value = foundTx.category;
      document.getElementById('tx-input').value = `${foundTx.amount} ${foundTx.description}`;
      document.getElementById('tx-date').value = foundTx.date.split('T')[0];
    }
  } else {
    document.getElementById('tx-input').value = '';
    document.getElementById('tx-new-cat').value = '';
    document.getElementById('tx-new-cat').style.display = 'none';
    document.getElementById('tx-date').valueAsDate = new Date();
  }
  document.getElementById('tx-modal').classList.add('active');
  setTimeout(() => document.getElementById('tx-input').focus(), 100);
}

function checkNewCatModal() {
  const select = document.getElementById('tx-cat');
  const input = document.getElementById('tx-new-cat');
  input.style.display = select.value === '__NEW__' ? 'block' : 'none';
}

function handleModalEnter(e) { if(e.key === 'Enter') saveTransaction(); }

function parseInput(text) {
  const match = text.match(/(\d+[\.,]?\d*)/);
  const amount = match ? parseFloat(match[1].replace(',','.')) : 0;
  const desc = text.replace(match ? match[0] : '', '').trim();
  return { amount, desc: desc || 'Без описания' };
}

function saveTransaction() {
  const type = document.getElementById('tx-type').value;
  const curr = document.getElementById('tx-curr').value;
  const inputVal = document.getElementById('tx-input').value;
  const catSelect = document.getElementById('tx-cat');
  const newCatInput = document.getElementById('tx-new-cat');
  const dateVal = document.getElementById('tx-date').value;
  const editId = document.getElementById('tx-edit-id').value;

  const { amount, desc } = parseInput(inputVal);
  if(amount <= 0) return alert('Введите сумму!');
  
  let category = catSelect.value;
  if(category === '__NEW__') {
    category = newCatInput.value.trim();
    if(!category) return alert('Введите название категории!');
  }

  const txMonth = dateVal ? dateVal.slice(0, 7) : currentMonth;
  if(!allData[txMonth]) allData[txMonth] = [];

  if (type === 'expense' && !editId) {
    const txs = allData[txMonth] || [];
    const income = txs.filter(t => t.type === 'income' && t.currency === curr).reduce((s,t)=>s+t.amount,0);
    const expense = txs.filter(t => t.type === 'expense' && t.currency === curr).reduce((s,t)=>s+t.amount,0);
    if ((balances[curr] + income - expense) < amount) return alert(`Недостаточно средств в ${curr}!`);
  }

  const txObj = { id: editId ? parseInt(editId) : Date.now(), type, amount, currency: curr, category, description: desc, date: dateVal ? new Date(dateVal).toISOString() : new Date().toISOString() };
  
  if(editId) {
    Object.keys(allData).forEach(m => {
      const idx = allData[m].findIndex(t => t.id == editId);
      if(idx !== -1) {
        allData[m][idx] = txObj;
        if(m !== txMonth) { allData[m].splice(idx, 1); allData[txMonth].push(txObj); }
      }
    });
  } else {
    allData[txMonth].push(txObj);
  }

  localStorage.setItem('finData', JSON.stringify(allData));
  if(txMonth !== currentMonth) currentMonth = txMonth;
  closeModal('tx-modal');
  init();
}

// --- ГРАФИКИ И СПИСКИ ---
function setChartCurr(type, c) {
  chartCurr[type] = c;
  const container = event.target.parentElement;
  Array.from(container.children).forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  updateCharts();
}

function toggleCategoryDropdown(type) {
  const dropdown = document.getElementById(type === 'expense' ? 'exp-cat-dropdown' : 'inc-cat-dropdown');
  const isActive = dropdown.classList.contains('active');
  
  // Закрыть все остальные
  document.querySelectorAll('.category-dropdown').forEach(d => d.classList.remove('active'));
  
  if(!isActive) {
    updateCategoryDropdown(type);
    dropdown.classList.add('active');
  }
}

function updateCategoryDropdown(type) {
  const txs = (allData[currentMonth] || []).filter(t => t.type === type && t.currency === chartCurr[type]);
  const cats = [...new Set(txs.map(t => t.category))];
  const dropdown = document.getElementById(type === 'expense' ? 'exp-cat-dropdown' : 'inc-cat-dropdown');
  
  let html = `<div class="cat-option" onclick="selectCategory('${type}', '')">📊 Показать график</div>`;
  cats.forEach(c => {
    html += `<div class="cat-option" onclick="selectCategory('${type}', '${c}')">${c}</div>`;
  });
  dropdown.innerHTML = html;
}

function selectCategory(type, cat) {
  selectedCat[type] = cat;
  document.getElementById(type === 'expense' ? 'exp-cat-dropdown' : 'inc-cat-dropdown').classList.remove('active');
  
  const listView = document.getElementById(type === 'expense' ? 'exp-list-view' : 'inc-list-view');
  const chartContainer = document.getElementById(type === 'expense' ? 'expChart' : 'incChart').parentElement;
  
  if(cat) {
    listView.style.display = 'block';
    chartContainer.style.display = 'none';
    renderGroupedList(type, cat);
  } else {
    listView.style.display = 'none';
    chartContainer.style.display = 'block';
    updateCharts(); // Перерисовать график
  }
}

function setPeriodFilter(type, period) {
  periodFilter[type] = period;
  const container = event.target.parentElement;
  Array.from(container.children).forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderGroupedList(type, selectedCat[type]);
}

function renderGroupedList(type, category) {
  const container = document.getElementById(type === 'expense' ? 'exp-list' : 'inc-list');
  const now = new Date();
  
  let txs = (allData[currentMonth] || []).filter(t => t.type === type && t.category === category && t.currency === chartCurr[type]);
  
  // Применяем фильтр периода
  if(periodFilter[type] === 'today') {
    txs = txs.filter(t => new Date(t.date).toDateString() === now.toDateString());
  } else if(periodFilter[type] === 'week') {
    const weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate()-7);
    txs = txs.filter(t => new Date(t.date) >= weekAgo);
  } else if(periodFilter[type] === 'month') {
    txs = txs.filter(t => new Date(t.date).getMonth() === now.getMonth());
  }

  // Сортируем по дате (новые сверху)
  txs.sort((a,b) => new Date(b.date) - new Date(a.date));

  // Группируем по дням
  const grouped = {};
  txs.forEach(t => {
    const dateKey = new Date(t.date).toLocaleDateString('ru-RU');
    if(!grouped[dateKey]) grouped[dateKey] = [];
    grouped[dateKey].push(t);
  });

  if(Object.keys(grouped).length === 0) {
    container.innerHTML = '<div style="color:#666; text-align:center; padding:20px;">Нет записей за этот период</div>';
    return;
  }

  let html = '';
  for(const [date, items] of Object.entries(grouped)) {
    html += `<div class="date-group-title">${date}</div>`;
    items.forEach(t => {
      html += `
        <div class="tx-item">
          <div class="tx-info">
            <b>${t.description}</b>
            <span>${t.category}</span>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:700; color:${type==='expense'?'#FF6B6B':'#00FF88'}">${formatMoney(t.amount, t.currency)}</div>
            <div class="tx-actions">
               <i data-lucide="pencil" class="action-icon" style="color:#667eea" onclick="openTxModal('${t.type}', ${t.id})"></i>
               <i data-lucide="trash-2" class="action-icon" style="color:#FF6B6B" onclick="deleteTx(${t.id})"></i>
            </div>
          </div>
        </div>`;
    });
  }
  container.innerHTML = html;
  lucide.createIcons();
}

function updateCharts() {
  renderChart('expense', 'expChart', expChart, (c) => expChart = c);
  renderChart('income', 'incChart', incChart, (c) => incChart = c);
}

function renderChart(type, canvasId, chartInstance, setChart) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  const txs = (allData[currentMonth] || []).filter(t => t.type === type && t.currency === chartCurr[type]);
  const byCat = {};
  const total = txs.reduce((s,t) => s+t.amount, 0);
  txs.forEach(t => byCat[t.category] = (byCat[t.category] || 0) + t.amount);
  
  if(chartInstance) chartInstance.destroy();
  
  const labels = Object.keys(byCat).map(k => {
    const percent = total > 0 ? ((byCat[k]/total)*100).toFixed(0) : 0;
    return `${k} (${percent}%)`;
  });

  const newChart = new Chart(ctx, {
    type: 'doughnut',
    data: { 
      labels: labels, 
      datasets: [{ data: Object.values(byCat), backgroundColor: ['#667eea','#764ba2','#00FF88','#FF6B6B','#FFC107','#00BCD4'], borderWidth: 0 }] 
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position:'bottom', labels:{color:'#fff'} } } }
  });
  setChart(newChart);
}

// --- УТИЛИТЫ ---
function toggleMenu() { document.getElementById('main-menu').classList.toggle('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function openBalanceModal() {
  document.getElementById('bal-usd').value = balances.USD;
  document.getElementById('bal-uah').value = balances.UAH;
  document.getElementById('bal-eur').value = balances.EUR;
  document.getElementById('rate-usd').value = rates.USD;
  document.getElementById('rate-eur').value = rates.EUR;
  document.getElementById('rate-eur-usd').value = rates.EUR_USD;
  document.getElementById('bal-modal').classList.add('active');
  toggleMenu();
}

function saveBalances() {
  balances.USD = parseFloat(document.getElementById('bal-usd').value) || 0;
  balances.UAH = parseFloat(document.getElementById('bal-uah').value) || 0;
  balances.EUR = parseFloat(document.getElementById('bal-eur').value) || 0;
  rates.USD = parseFloat(document.getElementById('rate-usd').value) || 41;
  rates.EUR = parseFloat(document.getElementById('rate-eur').value) || 45;
  rates.EUR_USD = parseFloat(document.getElementById('rate-eur-usd').value) || 1.08;
  localStorage.setItem('finBal', JSON.stringify(balances));
  localStorage.setItem('finRates', JSON.stringify(rates));
  closeModal('bal-modal');
  init();
}

function deleteTx(id) {
  if(!confirm('Удалить запись?')) return;
  Object.keys(allData).forEach(m => { allData[m] = allData[m].filter(t => t.id !== id); });
  localStorage.setItem('finData', JSON.stringify(allData));
  init();
  // Если мы в режиме списка, обновляем его
  if(selectedCat.expense) renderGroupedList('expense', selectedCat.expense);
  if(selectedCat.income) renderGroupedList('income', selectedCat.income);
}

function resetMonth() {
  if(confirm('Обнулить все записи и баланс за этот месяц?')) {
    allData[currentMonth] = [];
    balances = {USD:0, UAH:0, EUR:0};
    localStorage.setItem('finBal', JSON.stringify(balances));
    localStorage.setItem('finData', JSON.stringify(allData));
    init();
    toggleMenu();
  }
}

function exportToCSV() {
  let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
  csvContent += "Дата;Тип;Категория;Описание;Сумма;Валюта\n";
  (allData[currentMonth]||[]).forEach(t => {
    const row = [new Date(t.date).toLocaleDateString(), t.type === 'expense' ? 'Расход' : 'Доход', t.category, t.description, t.amount.toFixed(2).replace('.', ','), t.currency].join(";");
    csvContent += row + "\n";
  });
  
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);
  link.setAttribute("download", `finance_report_${currentMonth}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  toggleMenu();
}

if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js'); }); }
