<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои финансы</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Финансы">

<!-- Open Graph -->
<meta property="og:title" content="💰 Мои финансы">
<meta property="og:description" content="Умный учёт доходов и расходов">
<meta property="og:image" content="https://eaglehash24.github.io/finance-app/og-image.png?v=3">
<meta property="og:url" content="https://eaglehash24.github.io/finance-app/">
<meta property="og:type" content="website">

<link rel="icon" type="image/png" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Inter', sans-serif; 
  background: #0F0F14; 
  color: #fff; 
  max-width: 1200px; /* Растянули для ПК */
  width: 95%;
  margin: 0 auto; 
  padding: 20px; 
  min-height: 100vh; 
}

/* Шапка */
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.month-display { font-size: 20px; font-weight: 700; }
.month-select { padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; display: none; }
.menu-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; color: white; cursor: pointer; }

/* Баланс */
.balance-card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 25px;
  margin-bottom: 20px;
  text-align: center;
  cursor: pointer;
}
.balance-label { font-size: 12px; color: #fff; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.balance-value {
  font-size: 32px;
  font-weight: 700;
  color: #00FF88; /* Сплошной зеленый */
  margin-bottom: 5px;
  text-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
}
.balance-details { display: none; justify-content: center; gap: 20px; margin-top: 15px; font-size: 14px; color: #aaa; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
.balance-details.active { display: flex; }

/* Списки и Кнопки + */
.lists-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.list-header h3 { font-size: 16px; text-transform: uppercase; font-weight: 700; }
.add-btn-mini {
  width: 30px; height: 30px; border-radius: 50%; border: none; 
  display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; color: white;
}
.add-btn-mini.exp { background: #FF6B6B; }
.add-btn-mini.inc { background: #00FF88; color: #0F0F14; }

.tx-mini { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px; margin-bottom: 8px; font-size: 13px; position: relative; }
.tx-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.tx-desc { font-weight: 600; }
.tx-amount { font-weight: 700; }
.tx-meta { font-size: 11px; color: #666; }
.tx-actions { display: flex; justify-content: space-between; margin-top: 8px; }
.action-icon { width: 16px; height: 16px; cursor: pointer; }
.edit-icon { color: #667eea; }
.del-icon { color: #FF6B6B; }

/* Модалки */
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
.modal.active { display: flex; }
.modal-content { background: #1A1A24; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 25px; width: 100%; max-width: 400px; }
.close-modal { float: right; cursor: pointer; color: #888; }
.input-group { margin-bottom: 12px; }
.input-group label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
.input-group input, .input-group select { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; font-size: 14px; font-family: 'Inter', sans-serif; }
.save-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; color: white; font-size: 14px; font-weight: 600; cursor: pointer; background: #667eea; margin-top: 10px; }

/* Графики */
.chart-section { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
.chart-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
.chart-tab { flex: 1; padding: 10px; background: rgba(255,255,255,0.05); border: none; border-radius: 10px; color: #888; cursor: pointer; font-weight: 600; }
.chart-tab.active { background: rgba(102, 126, 234, 0.2); color: #667eea; border: 1px solid rgba(102, 126, 234, 0.4); }
.chart-currency-filter { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
.curr-filter-btn { padding: 5px 10px; background: rgba(255,255,255,0.05); border-radius: 5px; cursor: pointer; font-size: 12px; color: #888; }
.curr-filter-btn.active { background: #667eea; color: white; }
.chart-container { height: 250px; position: relative; }

/* Меню */
.dropdown-menu { display: none; position: absolute; top: 60px; right: 20px; background: rgba(26, 26, 36, 0.98); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; min-width: 200px; z-index: 1000; }
.dropdown-menu.active { display: block; }
.dropdown-item { padding: 12px 16px; display: flex; align-items: center; gap: 10px; color: #ccc; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }

@media (max-width: 768px) { 
  .lists-container { grid-template-columns: 1fr; } 
  body { max-width: 100%; }
}
</style>
</head>
<body>

<div class="header">
  <div id="month-text" class="month-display">Октябрь 2026</div>
  <select id="month-select" class="month-select" onchange="changeMonth()"></select>
  <button class="menu-btn" onclick="toggleMenu()"><i data-lucide="menu"></i></button>
</div>

<div class="dropdown-menu" id="main-menu">
  <div class="dropdown-item" onclick="openBalanceModal()">💵 Баланс и Курсы</div>
  <div class="dropdown-item" onclick="exportToPDF()">📄 Экспорт в PDF</div>
  <div class="dropdown-item" onclick="resetMonth()">🗑️ Обнулить месяц</div>
</div>

<!-- Баланс -->
<div class="balance-card" onclick="toggleBalanceDetails()">
  <div class="balance-label">Общий баланс (UAH)</div>
  <div id="balance-main" class="balance-value">0,00 ₴</div>
  <div id="balance-details" class="balance-details"></div>
</div>

<!-- Списки -->
<div class="lists-container">
  <div class="list-block">
    <div class="list-header">
      <h3 style="color:#FF6B6B">Расходы</h3>
      <button class="add-btn-mini exp" onclick="openTxModal('expense')">+</button>
    </div>
    <div id="expense-list"></div>
  </div>
  <div class="list-block">
    <div class="list-header">
      <h3 style="color:#00FF88">Доходы</h3>
      <button class="add-btn-mini inc" onclick="openTxModal('income')">+</button>
    </div>
    <div id="income-list"></div>
  </div>
</div>

<!-- График -->
<div class="chart-section">
  <div class="chart-tabs">
    <button class="chart-tab active" onclick="switchChart('expense')">Расходы</button>
    <button class="chart-tab" onclick="switchChart('income')">Доходы</button>
  </div>
  <div class="chart-currency-filter">
    <div class="curr-filter-btn active" onclick="setChartCurr('UAH')">UAH</div>
    <div class="curr-filter-btn" onclick="setChartCurr('USD')">USD</div>
    <div class="curr-filter-btn" onclick="setChartCurr('EUR')">EUR</div>
  </div>
  <div class="chart-container"><canvas id="mainChart"></canvas></div>
</div>

<!-- Модалка Баланса и Курсов -->
<div class="modal" id="bal-modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal('bal-modal')"><i data-lucide="x"></i></span>
    <h2>Баланс и Курсы</h2>
    <div class="input-group"><label>Начальный USD</label><input type="number" id="bal-usd"></div>
    <div class="input-group"><label>Начальный UAH</label><input type="number" id="bal-uah"></div>
    <div class="input-group"><label>Начальный EUR</label><input type="number" id="bal-eur"></div>
    <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
    <div class="input-group"><label>Курс USD к UAH</label><input type="number" id="rate-usd" step="0.01"></div>
    <div class="input-group"><label>Курс EUR к UAH</label><input type="number" id="rate-eur" step="0.01"></div>
    <button class="save-btn" onclick="saveBalances()">Сохранить</button>
  </div>
</div>

<!-- Модалка Ввода Транзакции -->
<div class="modal" id="tx-modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal('tx-modal')"><i data-lucide="x"></i></span>
    <h2 id="tx-modal-title">Добавить запись</h2>
    <input type="hidden" id="tx-type">
    
    <div class="input-group">
      <label>Валюта</label>
      <select id="tx-curr">
        <option value="UAH">₴ UAH</option>
        <option value="USD">$ USD</option>
        <option value="EUR">€ EUR</option>
      </select>
    </div>
    
    <div class="input-group">
      <label>Сумма / Описание</label>
      <input type="text" id="tx-input" placeholder="Например: 500 бургер" onkeypress="handleModalEnter(event)">
    </div>

    <div class="input-group">
      <label>Категория</label>
      <select id="tx-cat" onchange="checkNewCatModal()"></select>
      <input type="text" id="tx-new-cat" placeholder="Новая категория..." style="display:none; margin-top:5px;">
    </div>

    <div class="input-group">
      <label>Дата</label>
      <input type="date" id="tx-date">
    </div>

    <button class="save-btn" onclick="saveTransaction()">Сохранить</button>
  </div>
</div>

<!-- Модалка Детализации Графика -->
<div class="modal" id="chart-detail-modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal('chart-detail-modal')"><i data-lucide="x"></i></span>
    <h2 id="detail-title">Детализация</h2>
    <div class="period-filter" style="margin:15px 0;">
      <button class="filter-btn active" onclick="setDetailFilter('all')">Все</button>
      <button class="filter-btn" onclick="setDetailFilter('month')">Месяц</button>
      <button class="filter-btn" onclick="setDetailFilter('week')">Неделя</button>
    </div>
    <div id="detail-list"></div>
  </div>
</div>

<script>
let allData = JSON.parse(localStorage.getItem('finData')) || {};
let balances = JSON.parse(localStorage.getItem('finBal')) || {USD:0, UAH:0, EUR:0};
let rates = JSON.parse(localStorage.getItem('finRates')) || {USD:41.5, EUR:45.0}; // Примерные курсы
let currentMonth = new Date().toISOString().slice(0, 7);
let chartType = 'expense';
let chartCurr = 'UAH';
let pieChart = null;
let detailCategory = '';
let detailType = '';

const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const expCats = ['Еда','Транспорт','Жильё','Здоровье','Развлечения','Одежда','Подарки','Прочее'];
const incCats = ['Зарплата','Пенсия','Подарки','Фриланс','Кэшбэк','Прочее'];

if(!allData[currentMonth]) allData[currentMonth] = [];
init();

function init() {
  updateMonthUI();
  updateBalanceUI();
  updateLists();
  updateChart();
  lucide.createIcons();
}

// --- БАЛАНС ---
function updateBalanceUI() {
  const txs = allData[currentMonth] || [];
  let totalUAH = 0;
  
  // Считаем общий баланс в UAH
  ['USD','UAH','EUR'].forEach(c => {
    const income = txs.filter(t => t.type === 'income' && t.currency === c).reduce((s,t)=>s+t.amount,0);
    const expense = txs.filter(t => t.type === 'expense' && t.currency === c).reduce((s,t)=>s+t.amount,0);
    const net = balances[c] + income - expense;
    
    let valInUAH = net;
    if(c === 'USD') valInUAH = net * rates.USD;
    if(c === 'EUR') valInUAH = net * rates.EUR;
    
    totalUAH += valInUAH;
  });

  document.getElementById('balance-main').textContent = formatMoney(totalUAH, 'UAH');
  
  // Детали
  const detailsDiv = document.getElementById('balance-details');
  let html = '';
  ['USD','UAH','EUR'].forEach(c => {
    const income = txs.filter(t => t.type === 'income' && t.currency === c).reduce((s,t)=>s+t.amount,0);
    const expense = txs.filter(t => t.type === 'expense' && t.currency === c).reduce((s,t)=>s+t.amount,0);
    const total = balances[c] + income - expense;
    const sym = c === 'USD' ? '$' : c === 'UAH' ? '₴' : '€';
    html += `<div>${sym} ${formatMoney(total, c)}</div>`;
  });
  detailsDiv.innerHTML = html;
}

function toggleBalanceDetails() {
  document.getElementById('balance-details').classList.toggle('active');
}

// --- СПИСКИ И МОДАЛКИ ---
function openTxModal(type) {
  document.getElementById('tx-type').value = type;
  document.getElementById('tx-modal-title').textContent = type === 'expense' ? 'Добавить расход' : 'Добавить доход';
  document.getElementById('tx-input').value = '';
  document.getElementById('tx-new-cat').value = '';
  document.getElementById('tx-new-cat').style.display = 'none';
  document.getElementById('tx-date').valueAsDate = new Date();
  
  const catSelect = document.getElementById('tx-cat');
  const cats = type === 'expense' ? expCats : incCats;
  catSelect.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('') + '<option value="__NEW__">➕ Создать свою...</option>';
  
  document.getElementById('tx-modal').classList.add('active');
  document.getElementById('tx-input').focus();
}

function checkNewCatModal() {
  const select = document.getElementById('tx-cat');
  const input = document.getElementById('tx-new-cat');
  input.style.display = select.value === '__NEW__' ? 'block' : 'none';
}

function handleModalEnter(e) {
  if(e.key === 'Enter') saveTransaction();
}

function parseInput(text) {
  const match = text.match(/(\d+[\.,]?\d*)/);
  const amount = match ? parseFloat(match[1].replace(',','.')) : 0;
  const desc = text.replace(match ? match[0] : '', '').trim();
  return { amount, desc: desc || 'Без описания' };
}

function saveTransaction() {
  const type = document.getElementById('tx-type').value;
  const curr = document.getElementById('tx-curr').value;
  const inputVal = document.getElementById('tx-input').value;
  const catSelect = document.getElementById('tx-cat');
  const newCatInput = document.getElementById('tx-new-cat');
  const dateVal = document.getElementById('tx-date').value;

  const { amount, desc } = parseInput(inputVal);
  if(amount <= 0) return alert('Введите сумму!');
  
  let category = catSelect.value;
  if(category === '__NEW__') {
    category = newCatInput.value.trim();
    if(!category) return alert('Введите название категории!');
  }

  // Проверка баланса для расхода
  if (type === 'expense') {
    const txs = allData[currentMonth] || [];
    const income = txs.filter(t => t.type === 'income' && t.currency === curr).reduce((s,t)=>s+t.amount,0);
    const expense = txs.filter(t => t.type === 'expense' && t.currency === curr).reduce((s,t)=>s+t.amount,0);
    if ((balances[curr] + income - expense) < amount) {
      return alert(`Недостаточно средств в ${curr}!`);
    }
  }

  const tx = { 
    id: Date.now(), 
    type, amount, currency: curr, category, description: desc, 
    date: dateVal ? new Date(dateVal).toISOString() : new Date().toISOString() 
  };
  
  allData[currentMonth].push(tx);
  localStorage.setItem('finData', JSON.stringify(allData));
  closeModal('tx-modal');
  init();
}

function updateLists() {
  const txs = allData[currentMonth] || [];
  const render = (type, elId) => {
    const list = txs.filter(t => t.type === type).sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
    const el = document.getElementById(elId);
    if(list.length === 0) { el.innerHTML = '<div style="color:#666;font-size:12px">Нет записей</div>'; return; }
    el.innerHTML = list.map(t => {
      const sym = t.currency === 'USD' ? '$' : t.currency === 'UAH' ? '₴' : '€';
      const color = type === 'expense' ? '#FF6B6B' : '#00FF88';
      return `
        <div class="tx-mini">
          <div class="tx-header">
            <span class="tx-desc">${t.description}</span>
            <span class="tx-amount" style="color:${color}">${formatMoney(t.amount, t.currency)}</span>
          </div>
          <div class="tx-meta">${t.category} • ${new Date(t.date).toLocaleDateString()}</div>
          <div class="tx-actions">
            <i data-lucide="pencil" class="action-icon edit-icon" onclick="openEdit(${t.id})"></i>
            <i data-lucide="trash-2" class="action-icon del-icon" onclick="deleteTx(${t.id})"></i>
          </div>
        </div>`;
    }).join('');
    lucide.createIcons();
  };
  render('expense', 'expense-list');
  render('income', 'income-list');
}

// --- ГРАФИК ---
function setChartCurr(c) {
  chartCurr = c;
  document.querySelectorAll('.curr-filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  updateChart();
}

function updateChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');
  const txs = (allData[currentMonth] || []).filter(t => t.type === chartType && t.currency === chartCurr);
  const byCat = {};
  const total = txs.reduce((s,t) => s+t.amount, 0);
  txs.forEach(t => byCat[t.category] = (byCat[t.category] || 0) + t.amount);
  
  if(pieChart) pieChart.destroy();
  
  const labels = Object.keys(byCat).map(k => {
    const percent = total > 0 ? ((byCat[k]/total)*100).toFixed(0) : 0;
    return `${k} (${percent}%)`;
  });

  pieChart = new Chart(ctx, {
    type: 'doughnut',
    data: { 
      labels: labels, 
      datasets: [{ data: Object.values(byCat), backgroundColor: ['#667eea','#764ba2','#00FF88','#FF6B6B','#FFC107','#00BCD4'], borderWidth: 0 }] 
    },
    options: { 
      responsive: true, maintainAspectRatio: false, 
      onClick: (e, elements) => {
        if(elements.length > 0) {
          const index = elements[0].index;
          const catName = Object.keys(byCat)[index];
          openChartDetail(catName);
        }
      },
      plugins: { legend: { position:'bottom', labels:{color:'#fff'} } } 
    }
  });
}

function switchChart(type) {
  chartType = type;
  document.querySelectorAll('.chart-tab').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  updateChart();
}

// --- ДЕТАЛИЗАЦИЯ ГРАФИКА ---
function openChartDetail(cat) {
  detailCategory = cat;
  detailType = chartType;
  document.getElementById('detail-title').textContent = `${cat} (${chartType === 'expense' ? 'Расходы' : 'Доходы'})`;
  setDetailFilter('all');
  document.getElementById('chart-detail-modal').classList.add('active');
}

function setDetailFilter(period) {
  document.querySelectorAll('#chart-detail-modal .filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  
  const now = new Date();
  const txs = (allData[currentMonth] || []).filter(t => {
    if(t.category !== detailCategory || t.type !== detailType) return false;
    const d = new Date(t.date);
    if(period === 'month') return d.getMonth() === now.getMonth();
    if(period === 'week') { const w = new Date(now); w.setDate(w.getDate()-7); return d >= w; }
    return true;
  });

  const list = document.getElementById('detail-list');
  if(txs.length === 0) { list.innerHTML = '<div style="color:#666">Нет записей</div>'; return; }
  
  list.innerHTML = txs.map(t => {
    const sym = t.currency === 'USD' ? '$' : t.currency === 'UAH' ? '₴' : '€';
    return `
      <div class="tx-mini">
        <div class="tx-header">
          <span class="tx-desc">${t.description}</span>
          <span class="tx-amount">${formatMoney(t.amount, t.currency)}</span>
        </div>
        <div class="tx-meta">${new Date(t.date).toLocaleDateString()}</div>
        <div class="tx-actions">
          <i data-lucide="pencil" class="action-icon edit-icon" onclick="openEdit(${t.id})"></i>
          <i data-lucide="trash-2" class="action-icon del-icon" onclick="deleteTx(${t.id})"></i>
        </div>
      </div>`;
  }).join('');
  lucide.createIcons();
}

// --- УТИЛИТЫ ---
function formatMoney(amount, curr) {
  const sym = curr === 'USD' ? '$' : curr === 'UAH' ? '₴' : '€';
  return `${amount.toFixed(2).replace('.', ',')} ${sym}`;
}

function updateMonthUI() {
  const months = Object.keys(allData).sort();
  const textEl = document.getElementById('month-text');
  const selectEl = document.getElementById('month-select');
  const [y, m] = currentMonth.split('-');
  textEl.textContent = `${monthNames[parseInt(m)-1]} ${y}`;
  if(months.length > 1) {
    textEl.style.display = 'none';
    selectEl.style.display = 'block';
    selectEl.innerHTML = '';
    months.forEach(mo => {
      const opt = document.createElement('option');
      opt.value = mo;
      const [yy, mm] = mo.split('-');
      opt.textContent = `${monthNames[parseInt(mm)-1]} ${yy}`;
      if(mo === currentMonth) opt.selected = true;
      selectEl.appendChild(opt);
    });
  } else {
    textEl.style.display = 'block';
    selectEl.style.display = 'none';
  }
}

function changeMonth() {
  currentMonth = document.getElementById('month-select').value;
  if(!allData[currentMonth]) allData[currentMonth] = [];
  init();
}

function toggleMenu() { document.getElementById('main-menu').classList.toggle('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function openBalanceModal() {
  document.getElementById('bal-usd').value = balances.USD;
  document.getElementById('bal-uah').value = balances.UAH;
  document.getElementById('bal-eur').value = balances.EUR;
  document.getElementById('rate-usd').value = rates.USD;
  document.getElementById('rate-eur').value = rates.EUR;
  document.getElementById('bal-modal').classList.add('active');
  toggleMenu();
}

function saveBalances() {
  balances.USD = parseFloat(document.getElementById('bal-usd').value) || 0;
  balances.UAH = parseFloat(document.getElementById('bal-uah').value) || 0;
  balances.EUR = parseFloat(document.getElementById('bal-eur').value) || 0;
  rates.USD = parseFloat(document.getElementById('rate-usd').value) || 41;
  rates.EUR = parseFloat(document.getElementById('rate-eur').value) || 45;
  localStorage.setItem('finBal', JSON.stringify(balances));
  localStorage.setItem('finRates', JSON.stringify(rates));
  closeModal('bal-modal');
  init();
}

function deleteTx(id) {
  if(!confirm('Удалить запись?')) return;
  allData[currentMonth] = allData[currentMonth].filter(t => t.id !== id);
  localStorage.setItem('finData', JSON.stringify(allData));
  init();
  // Если модалка деталей открыта, обновить её
  if(document.getElementById('chart-detail-modal').classList.contains('active')) {
    setDetailFilter('all'); 
  }
}

function openEdit(id) {
  const tx = (allData[currentMonth] || []).find(t => t.id === id);
  if(!tx) return;
  // Можно реализовать полноценное редактирование через модалку, но пока оставим удаление
  // Для простоты в этом коде оставим только удаление, так как редактирование требует сложной логики модалок
  alert('Редактирование: удалите и создайте заново (в этой версии)');
}

function resetMonth() {
  if(confirm('Обнулить все записи и баланс за этот месяц?')) {
    allData[currentMonth] = [];
    balances = {USD:0, UAH:0, EUR:0};
    localStorage.setItem('finBal', JSON.stringify(balances));
    localStorage.setItem('finData', JSON.stringify(allData));
    init();
    toggleMenu();
  }
}

function exportToPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  
  // Добавляем шрифт с поддержкой кириллицы (упрощенно используем транслит или стандартный)
  // Для корректной кириллицы в jsPDF нужен кастомный шрифт, здесь используем базовый
  
  doc.text("Financial Report", 14, 22);
  doc.autoTable({
    head: [['Date', 'Type', 'Category', 'Desc', 'Amount']],
    body: (allData[currentMonth]||[]).map(t => [
      new Date(t.date).toLocaleDateString(), 
      t.type, 
      t.category, 
      t.description, 
      formatMoney(t.amount, t.currency)
    ]),
    startY: 30
  });
  doc.save(`Report_${currentMonth}.pdf`);
  toggleMenu();
}

if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js'); }); }
</script>
