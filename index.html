<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои финансы</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#667eea">
<!-- Open Graph теги (оставляем как были) -->
<meta property="og:title" content="💰 Мои финансы">
<meta property="og:description" content="Умный учёт доходов и расходов голосом">
<meta property="og:image" content="https://eaglehash24.github.io/finance-app/og-image.png?v=3">
<meta property="og:url" content="https://eaglehash24.github.io/finance-app/">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

<style>
/* Стили остаются теми же, что и в прошлом коде */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #0F0F14; color: #FFFFFF; max-width: 600px; margin: 0 auto; padding: 20px; min-height: 100vh; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.month-display { font-size: 20px; font-weight: 700; }
.month-select { padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; display: none; }
.menu-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; color: white; cursor: pointer; }
.balance-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px; margin-bottom: 20px; }
.balance-title { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.balance-row-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.balance-row-item:last-child { border-bottom: none; }
.balance-label { color: #ccc; font-size: 14px; }
.balance-value { font-weight: 700; font-size: 16px; }
.period-filter { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; }
.filter-btn { padding: 6px 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; color: #ccc; font-size: 12px; cursor: pointer; white-space: nowrap; }
.filter-btn.active { background: #667eea; color: white; border-color: #667eea; }
.lists-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
.list-block h3 { font-size: 12px; text-transform: uppercase; color: #888; margin-bottom: 10px; }
.tx-mini { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px; margin-bottom: 8px; font-size: 13px; }
.tx-mini-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
.tx-mini-desc { font-weight: 600; }
.tx-mini-amount { font-weight: 700; }
.tx-actions-mini { display: flex; gap: 5px; margin-top: 5px; }
.action-icon { width: 14px; height: 14px; color: #888; cursor: pointer; }
.input-section { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
.currency-switch { display: flex; gap: 10px; margin-bottom: 15px; }
.curr-btn { flex: 1; padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #888; font-size: 12px; cursor: pointer; text-align: center; }
.curr-btn.active { background: rgba(255,255,255,0.15); color: white; border-color: rgba(255,255,255,0.3); }
.input-group { margin-bottom: 12px; }
.input-group label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
.input-group input, .input-group select { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; font-size: 14px; font-family: 'Inter', sans-serif; }
.add-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; color: white; font-size: 14px; font-weight: 600; cursor: pointer; }
.add-btn.expense { background: linear-gradient(135deg, #FF6B6B 0%, #E05555 100%); }
.add-btn.income { background: linear-gradient(135deg, #00FF88 0%, #00D4FF 100%); color: #0F0F14; }
.chart-section { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
.chart-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
.chart-tab { flex: 1; padding: 10px; background: rgba(255,255,255,0.05); border: none; border-radius: 10px; color: #888; cursor: pointer; font-weight: 600; }
.chart-tab.active { background: rgba(102, 126, 234, 0.2); color: #667eea; border: 1px solid rgba(102, 126, 234, 0.4); }
.chart-container { height: 200px; position: relative; }
.dropdown-menu { display: none; position: absolute; top: 60px; right: 20px; background: rgba(26, 26, 36, 0.98); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; min-width: 200px; z-index: 1000; }
.dropdown-menu.active { display: block; }
.dropdown-item { padding: 12px 16px; display: flex; align-items: center; gap: 10px; color: #ccc; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
.modal.active { display: flex; }
.modal-content { background: #1A1A24; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 25px; width: 100%; max-width: 400px; }
.close-modal { float: right; cursor: pointer; color: #888; }
@media (max-width: 480px) { .lists-container { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="header">
  <div id="month-text" class="month-display">Октябрь 2026</div>
  <select id="month-select" class="month-select" onchange="changeMonth()"></select>
  <button class="menu-btn" onclick="toggleMenu()"><i data-lucide="menu"></i></button>
</div>

<div class="dropdown-menu" id="main-menu">
  <div class="dropdown-item" onclick="openBalanceModal()">💵 Начальный баланс</div>
  <div class="dropdown-item" onclick="exportToPDF()">📄 Экспорт в PDF</div>
  <div class="dropdown-item" onclick="resetMonth()">🗑️ Обнулить месяц</div>
